[package]
name = "tether"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Phone-first client for tmux sessions on a dev server, over Tailscale"
repository = "https://github.com/haowjy/tether"
publish = false

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
rand = { version = "0.9", features = ["std_rng"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
