[package]
name = "tether"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Phone-first client for tmux sessions on a dev server, over Tailscale"
repository = "https://github.com/haowjy/tether"
publish = false

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
ts-rs = "12"

[dev-dependencies]
rand = { version = "0.9", features = ["std_rng"] }
vt100 = "0.18"

[profile.release]
strip = true
lto = "thin"
