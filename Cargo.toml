[package]
name = "tether"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Phone-first client for tmux sessions on a dev server, over Tailscale"
repository = "https://github.com/haowjy/tether"
publish = false

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustix = { version = "1", features = ["fs", "net", "process"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ts-rs = "12"
tungstenite = { version = "0.29", default-features = false }

[dev-dependencies]
rand = { version = "0.9", features = ["std_rng"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"
vt100 = "0.18"

[profile.release]
strip = true
lto = "thin"
