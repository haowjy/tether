name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-release-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report release label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          labels="$(jq -r '.[] | select(startswith("release:"))' <<<"${LABELS_JSON}")"
          if [[ -n "${labels}" ]]; then
            echo "::notice::Release label(s): ${labels//$'\n'/, }"
          else
            echo "::warning::No release:* label set. Merging to main will publish a prerelease (RC); add release:skip to publish nothing."
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Shared preflight
        run: scripts/preflight.sh full

  real-tmux:
    name: Real tmux integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Real tmux suites
        run: TETHER_TMUX_TESTS=1 cargo test --test tmux_real --test hub_real -- --test-threads=1

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2

      - name: Check
        # Explicitly bypass rust-toolchain.toml to exercise the crate's MSRV.
        run: cargo +1.85 check --locked --all-targets
