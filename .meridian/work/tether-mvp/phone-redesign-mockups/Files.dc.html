<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-light{--bg:#eef0f4;--raised:#ffffff;--term-bg:#fafbfc;--hover:#e3e6ec;--sel:#dce7fb;--text:#171a21;--muted:#545a67;--border:#d6dae2;--accent:#2a5ec0;--onaccent:#ffffff;--term-fg:#262a33;--term-dim:#6d7380;--green:#2c7a47;--amber:#8a5900;--blue:#2a5ec0;--kb:#d0d3da;--scrim:rgba(20,24,33,.32);--danger:#b3261e}
.t-dark{--bg:#0d0d0d;--raised:#171717;--term-bg:#000000;--hover:#242424;--sel:#1b2738;--text:#ececec;--muted:#a0a0a0;--border:#2d2d2d;--accent:#7db7f2;--onaccent:#0a1726;--term-fg:#d9d9d9;--term-dim:#8a8a8a;--green:#72d38f;--amber:#e6b85c;--blue:#7db7f2;--kb:#2a2a2c;--scrim:rgba(0,0,0,.6);--danger:#ff8a80}
.f-phone{width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--raised);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.f-top{padding:54px 12px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)}
.f-ib{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:0}
.f-field{flex:1;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;padding:0 14px;box-sizing:border-box}
.f-up{color:var(--accent)}.f-up .f-ico{color:var(--accent)}
.f-path{flex:1;min-width:0;font:16px ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-path b{color:var(--text);font-weight:680}
.f-list{flex:1;min-height:0;overflow:hidden;padding:4px 8px}
.f-row{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--text);font:inherit;text-align:left;box-sizing:border-box}
.f-ico{flex:none;color:var(--muted);display:grid}
.f-dir .f-ico{color:var(--accent)}
.f-name{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-meta{color:var(--muted);font-size:13px;white-space:nowrap}
.f-cur{flex:1;min-width:0;height:44px;border:0;border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;padding:0 12px 0 14px;display:flex;gap:8px;align-items:center;text-align:left}
.f-curname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-curname b{font-weight:680}
.f-curmeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}
.f-dot{width:8px;height:8px;border-radius:4px;background:var(--accent)}
.f-bar{background:var(--raised);border-top:1px solid var(--border);padding:8px 12px 34px;display:flex;gap:8px;align-items:center}
.f-tabs{flex:1;min-width:0;display:flex;gap:8px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 78%,transparent);mask-image:linear-gradient(to right,#000 78%,transparent)}
.f-tab{flex:none;display:flex;align-items:center;height:44px;border-radius:12px;background:var(--bg)}
.f-tab.f-on{background:var(--sel)}
.f-tabmain{background:none;border:0;font:inherit;color:var(--muted);font-size:15px;height:44px;padding:0 14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.f-on .f-tabmain{color:var(--text);padding-right:4px}
.f-tabmain b{font-weight:680;color:var(--text)}
.f-x{background:none;border:0;color:var(--muted);width:36px;height:44px;display:grid;place-items:center;padding:0}
</style>
</helmet>
<div class="{{rootClass}}">
  <div class="f-top">
    <label class="f-field"><span class="f-path">~/repos/<b>tether</b></span></label>
  </div>
  <div class="f-list">
    <button class="f-row f-up"><span class="f-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span><span class="f-name">repos</span></button>
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="10">
      <button class="{{e.cls}}">
        <span class="f-ico"><sc-if value="{{e.dir}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></sc-if><sc-if value="{{e.file}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg></sc-if></span>
        <span class="f-name">{{e.name}}</span>
        <span class="f-meta">{{e.meta}}</span>
      </button>
    </sc-for>
  </div>
  <div class="f-bar">
    <button class="f-cur" aria-label="tether files, 4 tabs, b1 rang. Open the sessions sheet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="f-curname"><b>tether</b> files</span><span class="f-curmeta"><span class="f-dot"></span>4 tabs</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const raw = [
      ['docs', true, '6 items'], ['ios', true, '9 items'], ['scripts', true, '12 items'],
      ['src', true, '14 items'], ['web', true, '31 items'], ['AGENTS.md', false, '3 KB · 2d'],
      ['CHANGELOG.md', false, '9 KB · 1h'], ['Cargo.toml', false, '2 KB · 4d'],
      ['README.md', false, '6 KB · 2d'], ['rust-toolchain.toml', false, '96 B · 6d']
    ];
    return {
      rootClass: 'f-phone t-' + theme,
      entries: raw.map(function (r) {
        return { name: r[0], dir: r[1], file: !r[1], meta: r[2], cls: r[1] ? 'f-row f-dir' : 'f-row' };
      })
    };
  }
}
</script>
</body>
</html>
