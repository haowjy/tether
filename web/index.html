<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>tether</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #chrome { position: relative; }
      #terminal { flex: 1; min-height: 0; overflow: hidden; }
      /* Unstyled until the visual UI lands. */
      .tabbar { display: flex; gap: 8px; padding: 6px; background: #181818; overflow-x: auto; }
      .tabbar [role="button"] { display: inline-block; padding: 4px 6px; }
      .tab.active { background: #333; }
      .picker, .notice { z-index: 10; position: absolute; bottom: 100%; left: 0; right: 0; background: #222; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="app"><div id="terminal"></div><div id="chrome"></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
